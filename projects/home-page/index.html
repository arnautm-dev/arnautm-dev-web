<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pestanya nova</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    
    <link rel="shortcut icon" href="icon.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
        <div id="txt">
            <h1>Benvingut, Arnau!</h1>
        </div>
        <div id="google">
            <div class="search-container">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Cerca a Google o escriu un URL"
                    autofocus
                    autocomplete="off"
                >
            </div>
        </div>
        <div id="shortcuts">
            <section id="quick-links">
                <a href="https://www.youtube.com" class="quick-link">
                    <img src="shortcuts/youtube.png" alt="YouTube logo">
                    <span>YouTube</span>
                </a>
                <a href="https://mail.google.com/mail/u/0/#inbox" class="quick-link">
                    <img src="shortcuts/gmail.png" alt="Google Mail logo">
                    <span>Gmail</span>
                </a>
                <a href="https://www.drive.google.com" class="quick-link">
                    <img src="shortcuts/drive.png" alt="Google drive logo">
                    <span>Drive</span>
                </a>
            
                <a href="https://translate.google.com" class="quick-link">
                    <img src="shortcuts/translator.png" alt="Google Translator logo">
                    <span>Traductor</span>
                </a>
                <a href="https://open.spotify.com" class="quick-link">
                    <img src="shortcuts/spotify.png" alt="Spotify logo">
                    <span>Spotify Player</span>
                </a>
                <a href="https://classroom.google.com/c/Njk5OTc2MTMxMzA0" class="quick-link">
                    <img src="shortcuts/classroom.png" alt="Google Classroom logo">
                    <span>GR2 Classroom</span>
                </a>
                <a href="https://github.com/repos" class="quick-link">
                    <img src="shortcuts/github.png" alt="GitHub logo">
                    <span>GitHub</span>
                </a>
            </section>
        </div>
    <script src="google-search.js"></script>
    <script src="circles.js"></script>
</body>
</html>
